name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pygame
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile quota_api.py quota_display.py
      - name: Import modules (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import quota_api, quota_display; print('imports OK')"
